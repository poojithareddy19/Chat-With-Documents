name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The unit tests use a fake embedder, so torch and the sentence-transformers
      # model are deliberately not installed here. See README, "Testing".
      - run: pip install -r requirements-ci.txt
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
