[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-with-documents"
version = "1.0.0"
description = "Local RAG chat over PDFs with page-level citations (Streamlit, FAISS, Ollama)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "faiss-cpu>=1.8",
    "numpy>=1.24",
    "pypdf>=4",
    "requests>=2.31",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "python-dotenv>=1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chat-with-documents = "chat_with_documents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["pdf", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # faiss-cpu's SWIG bindings trigger this on Python 3.9; nothing to fix on our side
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
